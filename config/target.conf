# mbaos target configuration — sourced by every build script.
# Plain shell variable assignments only. No logic here.

# ---- Machine ----------------------------------------------------------------
# MacBookAir7,1 (11") / MacBookAir7,2 (13"): Broadwell-U, 2C/4T, AVX2, AES-NI.
TARGET=x86_64-mba-linux-musl
TARGET_ARCH=broadwell          # baked into GCC via --with-arch, so it is the default
                               # even for a recipe that drops our CFLAGS.

# ---- Target compile flags (used by every package recipe, Phase 2+) ----------
# PIE and -fstack-protector-strong are compiler defaults (GCC configured with
# --enable-default-pie --enable-default-ssp); they are repeated here so the
# intent is visible and so a recipe that resets CFLAGS keeps them.
TARGET_CFLAGS="-O2 -pipe -march=broadwell -mtune=broadwell -fPIE -fstack-protector-strong -fstack-clash-protection"
TARGET_LDFLAGS="-pie -Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack -Wl,--as-needed -Wl,--hash-style=gnu"
# STUB (stated, not hidden): _FORTIFY_SOURCE is NOT enabled yet. musl does not
# implement it; it needs fortify-headers, which is added in Phase 2 together
# with the first target userland. Until then -D_FORTIFY_SOURCE would be a no-op
# that only looks like hardening, so it is deliberately left out.

# ---- Reproducibility ----------------------------------------------------------
# Every timestamp written into an output (filesystem metadata, archives) is
# clamped to this. Bump it deliberately when the lockfile changes.
SOURCE_DATE_EPOCH=1763424000   # 2025-11-18T00:00:00Z

# Fixed identifiers so the disk image is bit-for-bit reproducible.
DISK_GUID=6d62616f-7300-4000-8000-000000000001
ESP_PART_GUID=6d62616f-7300-4000-8000-000000000002
ROOT_PART_GUID=6d62616f-7300-4000-8000-000000000003
ESP_VOLID=4D424130             # FAT volume serial, 8 hex digits
ROOT_FS_UUID=6d62616f-7300-4000-8000-0000000000f0
ROOT_FS_HASH_SEED=6d62616f-7300-4000-8000-0000000000f1

# ---- Disk image layout --------------------------------------------------------
ESP_SIZE_MIB=256
ROOT_SIZE_MIB=1024

# mbaos source lock. One source per line, whitespace-separated:
#
#   name  version  url  sha256  signature-url
#
# sha256 "-" means NOT YET LOCKED. `./build.sh fetch` refuses to use an
# unlocked source. `./build.sh lock` downloads it, verifies the upstream GPG
# signature against keys/trusted.gpg, and only then writes the sha256 here.
# After that the checksum is the only thing trusted; signatures are not
# re-checked on every build.
#
# `{v}` in a URL is replaced by the version.
#
# Phase 0 status: every entry below is UNLOCKED. Checksums were not invented
# from memory. They must come from a verified download (see DESIGN.md §0.6).

binutils  2.45     https://ftp.gnu.org/gnu/binutils/binutils-{v}.tar.xz          -  https://ftp.gnu.org/gnu/binutils/binutils-{v}.tar.xz.sig
gcc       15.2.0   https://ftp.gnu.org/gnu/gcc/gcc-{v}/gcc-{v}.tar.xz            -  https://ftp.gnu.org/gnu/gcc/gcc-{v}/gcc-{v}.tar.xz.sig
gmp       6.3.0    https://ftp.gnu.org/gnu/gmp/gmp-{v}.tar.xz                    -  https://ftp.gnu.org/gnu/gmp/gmp-{v}.tar.xz.sig
mpfr      4.2.2    https://ftp.gnu.org/gnu/mpfr/mpfr-{v}.tar.xz                  -  https://ftp.gnu.org/gnu/mpfr/mpfr-{v}.tar.xz.sig
mpc       1.3.1    https://ftp.gnu.org/gnu/mpc/mpc-{v}.tar.gz                    -  https://ftp.gnu.org/gnu/mpc/mpc-{v}.tar.gz.sig
musl      1.2.5    https://musl.libc.org/releases/musl-{v}.tar.gz                -  https://musl.libc.org/releases/musl-{v}.tar.gz.asc
# Kernel: only its UAPI headers are used in Phase 0. Phase 1 re-pins to the
# newest stable release after checking kernel.org. kernel.org signs the
# *uncompressed* tarball; lock.sh handles that (.tar.sign).
linux     6.18.44  https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{v}.tar.xz -  https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-{v}.tar.sign
